<style>
:root{--paper:#F2F5F6;--card:#fff;--ink:#1C2830;--muted:#5B6B75;--line:#D5DEE2;--teal:#0E6B74;--err:#B8442F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0F1518;--card:#172025;--ink:#E4ECEF;--muted:#9AAAB3;--line:#2A363C;--teal:#5FB7BF;--err:#E07A66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;padding:16px}
main{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
h1{font:700 24px/1.3 "Noto Serif SC","Songti SC","STSong","SimSun",serif;margin:0 0 6px;letter-spacing:.04em}
p{margin:0 0 16px;color:var(--muted);font-size:14px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
button{font:inherit;padding:10px 18px;border:0;border-radius:10px;background:var(--teal);color:#fff;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#msg{margin:12px 0 0;min-height:1.5em;font-size:14px}
#msg.err{color:var(--err)}
</style>

function openWith(pw,silent){
  msg.className='';msg.textContent='正在打开…';
  dec(pw).then(function(h){
    try{sessionStorage.setItem('fam-k',pw)}catch(e){}
    document.open();document.write(h);document.close();
  }).catch(function(){
    try{sessionStorage.removeItem('fam-k')}catch(e){}
    msg.className=silent?'':'err';msg.textContent=silent?'':'密码不对，请再输一次';
  });
}
if(!window.crypto||!crypto.subtle||!window.TextDecoder){
  msg.className='err';msg.textContent='这个浏览器打不开。请点右上角“…”，选“在浏览器中打开”。';
}else{
  var saved=null;try{saved=sessionStorage.getItem('fam-k')}catch(e){}
  if(saved)openWith(saved,true);
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();openWith(document.getElementById('pw').value,false)});
}
